services:
  postgres:
    image: postgres:16-alpine
    container_name: sellitright_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sellitright
      POSTGRES_PASSWORD: sellitright_local
      POSTGRES_DB: sellitright_dev
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sellitright -d sellitright_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
