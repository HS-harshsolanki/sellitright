app = "chapternew-staging"
primary_region = "sin"

[build]
  dockerfile = "apps/web/Dockerfile"
  # NEXT_PUBLIC_* vars are passed via --build-arg in deploy-staging.yml.
  # Do NOT add [build.args] here — empty strings would bake silently into the image.

[env]
  PORT = "3000"
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_APP_ENV = "staging"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
